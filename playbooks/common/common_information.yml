# Common Information

# ansible_facts['lsb']['...'] is not always defined by default on all
# linux distributions. Create our own version.
- name: "Dummy up lsb_facts['...']"
  ansible.builtin.set_fact:
    lsb_facts:
      major_release: "{{ ansible_facts['distribution_major_version']|int }}"

# Amazon Linux is OS family 'RedHat' but doesn't follow Redhat's
# version numbering. Use the Magic number 5.
# AML 1 -> RHEL 6
# AML 2 -> RHEL 7
# AML 2xxx ??? -> this can probably die as no one is using AML <= 2 anymore
- name: "Dummy up Amazon Linux OS family version numbering if needed"
  ansible.builtin.set_fact:
    lsb_facts:
      major_release: "{{ ansible_facts['distribution_major_version']|int + 5 }}"
  when:
    - (
       ansible_facts['distribution'] == "Amazon"
       and
       lsb_facts['major_release'] < 2000
      )

#- name: Print all available facts
#  ansible.builtin.debug:
#    var: ansible_facts

# Print ansible fact information
- name: "Ansible fact information"
  local_action: command printf "\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n\n" \
                "ansible_distribution - {{ ansible_facts['distribution'] }}" \
                "ansible_os_family - {{ ansible_facts['os_family'] }}" \
                "ansible_distribution_version - {{ ansible_facts['distribution_version'] }}" \
                "ansible_distribution_version(int) - {{ ansible_facts['distribution_version']|int }}" \
                "lsb_facts.major_release - {{ lsb_facts['major_release'] }}" \
                "ansible_distribution_major_version - {{ ansible_facts['distribution_major_version'] }}" \
                "ansible_distribution_release - {{ ansible_facts['distribution_release'] }}"
  when: print_information is defined
  changed_when: false
